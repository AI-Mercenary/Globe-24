  #menuBtn { width:32px; height:32px; display:grid; place-items:center; background:none; border:1px solid var(--line2); border-radius:5px; color:var(--tx); cursor:pointer; flex:none }
  #menuBtn:hover, body.menu-open #menuBtn { background:#1f4d73; border-color:#2f6c9e }
  #menuBtn svg { width:16px; height:16px; stroke:currentColor; stroke-width:1.8; fill:none }
  #left { display:none }
  body.menu-open #left { display:flex; z-index:9; left:0; top:44px; bottom:28px; width:min(340px,90vw); padding:10px; gap:10px;

  body.menu-open #left > .panel { flex:none } body.menu-open #events .pb { max-height:42vh } body.menu-open #log .pb { max-height:200px }
  body.menu-open #scrim { display:block }
  @keyframes slideIn { from { transform:translateX(-24px); opacity:0 } }
  #gallery { flex:1 } #galList { padding:8px; display:flex; flex-direction:column; gap:8px; overflow-y:auto }
  .gcard { position:relative; border-radius:5px; overflow:hidden; cursor:pointer; border:1px solid var(--line); flex:none; height:150px; background:#0f151d; transition:border-color .15s }
  .gcard:hover { border-color:#2f6c9e } .gcard img { width:100%; height:100%; object-fit:cover; display:block; opacity:0; transition:opacity .6s }
  .gcard img.on { opacity:1 }
  .gcard .cap { position:absolute; left:0; right:0; bottom:0; padding:16px 9px 6px; background:linear-gradient(#0000,#000c); font-size:11.5px }
  .gcard .cap b { display:block; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .gcard .cap span { font:10px var(--mono); color:var(--tx2) }
  #scrim { position:fixed; inset:44px 0 28px 0; background:#0006; z-index:8; display:none }
  /* side rails */
  .rail { position:fixed; top:56px; bottom:40px; z-index:6; display:flex; flex-direction:column; gap:10px; width:300px; pointer-events:none }
  .rail > * { pointer-events:auto }
  #left { left:12px } #right { right:12px }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:6px; overflow:hidden; display:flex; flex-direction:column; min-height:0 }
  .panel h3 { display:flex; justify-content:space-between; align-items:center; font:600 10px var(--sans); letter-spacing:.12em; color:var(--tx2);
              padding:9px 12px; border-bottom:1px solid var(--line); text-transform:uppercase }
  .panel h3 em { font-style:normal; font-weight:400; color:var(--tx3); letter-spacing:.04em }
  .pb { padding:8px 12px; overflow:auto }
  .row { display:flex; justify-content:space-between; gap:10px; padding:2px 0 } .k { color:var(--tx2) }

  /* layers */
  .lyr { display:flex; align-items:center; gap:9px; padding:5px 0; cursor:pointer; user-select:none; color:var(--tx) }
  .lyr input { display:none }
  .lyr .sw { width:26px; height:14px; border-radius:7px; background:#26303b; position:relative; flex:none; transition:.15s }
  .lyr .sw::after { content:''; position:absolute; left:2px; top:2px; 

  /* legend positioning – fluid layout */
  #wxLegend {
    right:8px;
    left:auto;
  }
</style>

(async () => {

   * loadWxGrid – fetch each point individually, retry on failure, and store
   * only temperature data to localStorage to stay well within quota limits.
   * ---------------------------------------------------------------------- */
  window.loadWxGrid = async function(points) {
    // points: array of {lat,lon}
    if (!Array.isArray(points) || points.length === 0) return;

    const fetchPoint = async (lat, lon) => {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,wind_u_component_10m,wind_v_component_10m`;
      for (let attempt = 0; attempt < 3; attempt++) {
        try {
          const resp = await fetch(url);
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          return await resp.json();
        } catch (e) {
          if (attempt === 2) console.error('Failed to fetch weather for', lat, lon, e);
          // small back‑off before retry
          await new Promise(r => setTimeout(r, 200 * (attempt + 1)));
        }
      }
      return null;
    };

    const results = await Promise.all(points.map(p => fetchPoint(p.lat, p.lon)));

    const wxg = { T: [], U: [], V: [] };
    results.forEach(data => {
      if (data && data.hourly) {
        wxg.T.push(...data.hourly.temperature_2m);
        wxg.U.push(...data.hourly.wind_u_component_10m);
        wxg.V.push(...data.hourly.wind_v_component_10m);
      }
    });

    // expose globally for other modules
    window.wxg = wxg;

    // Store only temperature to localStorage (compresses size dramatically)
    try {
      const payload = JSON.stringify({ T: wxg.T });
      localStorage.setItem('wxGrid', payload);
    } catch (e) {
      console.warn('Unable to store weather grid in localStorage', e);
